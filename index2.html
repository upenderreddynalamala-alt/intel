<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>COURSE REGISTRATION</h1>
    <fieldset>
        <legend>personal details</legend>
    <form action="thank you.html">
        <table>
            <tr>     
                <td><label>name</label></td>
                <td><input type="text" name="FN" placeholder="EX:upendar reddy" size="16" required></td>
            </tr>
            <tr>
                 <td><label>Surname</label></td>
                 <td><input type="text" name="SN" placeholder="EX:nalamala" size="16" required></td>
            </tr>
            <tr>
                <td><label>mobile number</label></td>
                <td><input type="tel" name="MN" placeholder="EX:798-897-9876" size="16" required></td>
            </tr>
            <tr>
                <td><label>email</label></td>
                <td><input type="email" name="EM" placeholder="EX:something@gmail.com" size="16" required></td>
            </tr>
           
                <td><label>password</label></td>
                <td><input type="password" name="PW" placeholder="EX:********" size="16" required></td>
            </tr>
            <tr>
                <td><label>confirm password</label></td>
                <td><input type="password" name="CPW" placeholder="EX:********" size="16" required></td>
            </tr>
            <tr>
                 <td><label>date of birth</label></td>
                 <td><input type="date" name="DOB" size="16" required></td>
            </tr>
        </table>
 
 <label>gender</label>

 <input type="radio" name="gender">male
 <input type="radio" name="gender">female
 <input type="radio" name="gender">other<br>


  <label>select country</label>
    <select name="country">
        <option value="india">india</option>
        <option value="usa">usa</option>
        <option value="uk">uk</option>
        <option value="australia">australia</option>
        <option value="canada">canada</option>
    </select><br>

 <label>upload picture</label>
 <input type="file"><br>

 <input type="reset"><br>
 
 <input type="submit"><br>
    </fieldset>
    </form>

</body>
</html>
